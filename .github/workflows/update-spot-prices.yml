name: Update memory spot prices

on:
  schedule:
    # 01:10 UTC = 10:10 KST, DRAMeXchange 가 당일 현물가를 올린 뒤.
    - cron: "10 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-spot-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch DRAMeXchange spot prices
        id: fetch
        run: node scripts/fetch-dramexchange.mjs --dump /tmp/dramexchange.html

      - name: Upload page snapshot on failure
        if: failure() && steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dramexchange-html
          path: /tmp/dramexchange.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated CSV
        run: |
          if git diff --quiet -- data/memory-spot.csv; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memory-spot.csv
          git commit -m "chore(data): update memory spot prices ($(date -u +%Y-%m-%d))"
          git push
