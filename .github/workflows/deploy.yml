name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    # 09:10 UTC = 18:10 KST. 한국 증시 마감(06:30 UTC) 이후이고,
    # DRAMeXchange 가 당일 현물가를 올린 뒤이며, 미국 종가는 전일치가 들어온다.
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "CSV를 쓰지 않고 파싱 결과만 확인 (HTML 스냅샷 아티팩트 포함)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch DRAMeXchange spot prices
        id: spot
        # 파서가 깨져도 사이트를 내리지는 않는다. 기존 CSV로 그대로 배포하고,
        # 실패 사실은 아래 스냅샷 아티팩트와 요약으로 남긴다.
        continue-on-error: true
        run: |
          node scripts/fetch-dramexchange.mjs --dump /tmp/dramexchange.html \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload page snapshot
        # 실패했을 때, 그리고 수동 점검 실행일 때 원본 HTML을 남긴다.
        if: steps.spot.outcome == 'failure' || inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dramexchange-html
          path: /tmp/dramexchange.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Build static data
        env:
          MEMORY_API_URL: ${{ vars.MEMORY_API_URL }}
          MEMORY_API_KEY: ${{ secrets.MEMORY_API_KEY }}
        run: node scripts/build-data.mjs

      - name: Commit data updates
        # 수집이 실패해도 last-build.json 은 커밋한다 — 실패 원인이 거기 남는다.
        if: always()
        run: |
          if git diff --quiet -- data/; then
            echo "데이터 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memory-spot.csv data/last-build.json
          git commit -m "chore(data): update spot prices and build log ($(date -u +%Y-%m-%d))"

          # 크론과 push 실행이 겹치거나, workflow_dispatch 가 지나간 SHA 를 체크아웃해
          # 브랜치가 앞서 있을 수 있다. 그럴 때는 리베이스 후 다시 민다.
          # -X theirs 는 리베이스에서 '지금 얹는 쪽', 즉 방금 생성한 데이터를 택한다.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push 거부됨 (시도 $attempt) — 리베이스 후 재시도"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

      - name: Build site
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
